<section class="contact-section" style="background-color: var(--color-surface-alt);">
  <div class="container" style="max-width: 600px;">
    <h2 data-content="contact.title"></h2>
    <p data-content="contact.description" style="text-align: center; margin-bottom: var(--spacing-xl);"></p>
    
    <div class="contact-info" style="margin-bottom: var(--spacing-xl);">
      <div class="contact-item">
        <strong>Address:</strong>
        <span data-content="contact.address"></span>
      </div>
      <div class="contact-item">
        <strong>Email:</strong>
        <a href="mailto:" data-href-prefix="mailto:" data-content="contact.email"></a>
      </div>
      <div class="contact-item">
        <strong>Phone:</strong>
        <a href="tel:" data-href-prefix="tel:" data-content="contact.phone"></a>
      </div>
    </div>
  </div>
</section>
