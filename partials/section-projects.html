<section class="projects-section">
  <div class="container">
    <h2 data-content="projects.title"></h2>
    <div class="grid" data-repeat="projects.items">
      <div class="card">
        <h3 data-text="projects.items.*.title"></h3>
        <p data-text="projects.items.*.description"></p>
      </div>
    </div>
    <div style="text-align: center; margin-top: var(--spacing-xl);">
      <p style="color: var(--color-text-light); font-size: var(--font-size-lg);">Featured projects coming soon.</p>
    </div>
  </div>
</section>
