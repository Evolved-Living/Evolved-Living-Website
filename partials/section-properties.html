<section class="properties-section">
  <div class="container">
    <h2>Available Properties</h2>
    <div class="grid" data-repeat="properties.items">
      <div class="card">
        <h3 data-text="properties.items.*.title"></h3>
        <p data-text="properties.items.*.description"></p>
      </div>
    </div>
    <div style="text-align: center; margin-top: var(--spacing-xl);">
      <p style="color: var(--color-text-light); font-size: var(--font-size-lg);">Available properties coming soon.</p>
    </div>
  </div>
</section>
